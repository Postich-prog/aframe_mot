<html>
  <head>
  <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
  <script src="https://unpkg.com/aframe-environment-component/dist/aframe-environment-component.min.js"></script>
  <script>
  AFRAME.registerComponent('scale-on-mouseenter', {
    schema: {
      to: {default: '2.5 2.5 2.5', type: 'vec3'}
    },

    init: function () {
      var data = this.data;
      var el = this.el;
      this.el.addEventListener('mouseenter', function () {
        el.object3D.scale.copy(data.to);
      });
    }
  });
</script>
</head>
  <body>
    <a-scene cursor="rayOrigin: mouse">
        <a-cylinder
  position="2.5 0.75 -5"
  radius="0.5"
  height="1.5"
  color="#FFC65D">
</a-cylinder>
        <a-assets>
            <img id="boxTexture" src="https://i.imgur.com/mYmmbrp.jpg">
            <a-asset-item
                id="myComposition"
                src="./models/scene.glb">
            </a-asset-item>
        </a-assets>
        <a-entity
  gltf-model="#myComposition"
  position="-2 0 -5"
  rotation="0 0 0"
  scale="1 1 1">
</a-entity>
        <a-box src="https://i.imgur.com/dpUXQ1a.jpeg" position="0 2 -5" rotation="0 45 45" scale="2 2 2"
            animation="property: object3D.position.y; to: 2.2; dir: alternate; dur: 2000; loop: true"scale-on-mouseenter></a-box>


  <!-- Out of the box environment! -->
  <a-entity environment="preset: goaland; dressingAmount: 500"></a-entity>
  <a-entity
  text="value: Matvey Slutskikh  PIN-22M; color: #FFFFFF"
  position="3 0.2 -3"
  scale="4 4 4"></a-entity>
</a-scene>
  </body>
</html>
